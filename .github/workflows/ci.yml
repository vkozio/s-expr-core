name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  rust:
    name: Rust tests and lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all

  coverage:
    name: Coverage (cargo-llvm-cov)
    runs-on: ubuntu-latest
    needs: rust
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run coverage with soft threshold
        run: cargo llvm-cov --all-features --workspace --fail-under-lines 75

  wasm:
    name: WASM build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM package (bundler target)
        run: wasm-pack build wasm --target bundler --out-dir ../web/pkg

      - name: Ensure web/pkg is up to date in git
        run: git diff --exit-code web/pkg

